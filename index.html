<body>

<header id="header">
    <div class="header-content">
        <div class="title-area">
            <h1>הקניות שלנו <span id="sync-status" class="sync-status">מקומי</span></h1>
            <div class="progress-container">
                <span class="progress-text" id="progress-text">0/0 נקנו</span>

            </div>
        </div>
        <div style="display: flex; align-items: center;">
            <button class="action-btn" id="search-btn" onclick="App.toggleSearch()" aria-label="חיפוש מוצר">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="action-btn" id="menu-btn" onclick="App.openSettings()" aria-label="אפשרויות">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </button>
        </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="רשימות">
        <div class="tab-indicator"></div>
        <button class="tab-btn active" id="tab-grocery" role="tab" aria-selected="true" onclick="App.switchTab('grocery')">

        </button>
        <button class="tab-btn" id="tab-home" role="tab" aria-selected="false" onclick="App.switchTab('home')">
            <span class="tab-emoji">🛋️</span> ריהוט וציוד לבית <span class="tab-badge" id="badge-home"></span>

    </nav>

    <div class="search-row" id="search-row">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="search-input" class="search-input" placeholder="חפש מוצר ברשימה" autocomplete="off" enterkeyhint="search">
            <button class="search-clear" id="search-clear" onclick="App.clearSearch()" aria-label="נקה חיפוש">&times;</button>
        </div>
        <div class="search-meta" id="search-meta"></div>
    </div>
</header>

<main class="container" id="main">
    <div class="filter-bar" id="filter-bar" role="toolbar" aria-label="סינון לפי קטגוריה"></div>
    <div class="list-area" id="list-container"></div>
</main>

<button class="fab-shop" id="shop-mode-btn" onclick="App.toggleShoppingMode()">

    <span id="shop-mode-text">מצב קנייה</span>
</button>

<div class="modal-overlay" id="edit-modal">

<div class="modal-overlay" id="settings-modal">

        HOME_SUGGESTIONS: ['ספה', 'שולחן אוכל', 'מיטה זוגית', 'מזרן', 'ארון בגדים', 'מקרר', 'מכונת כביסה', 'שטיח לסלון', 'מנורה עומדת', 'וילונות', 'סט מצעים', 'מגבות רחצה'],

        init() {
            // Sort dictionary keys by length descending so longer words match first (e.g., 'חלב סויה' before 'חלב')
            const byLength = dict => Object.keys(dict).sort((a, b) => b.length - a.length);
            this.dicts = { grocery: this.SMART_DICT, home: this.HOME_DICT };
            this.sortedDictKeys = { grocery: byLength(this.SMART_DICT), home: byLength(this.HOME_DICT) };
            this.money = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 });
            this.cacheDOM();
            this.bindEvents();

            const fromHash = location.hash.slice(1);
            const initialTab = LISTS[fromHash] ? fromHash : (LISTS[store.get('premium_active_tab', 'grocery')] ? store.get('premium_active_tab', 'grocery') : 'grocery');
            this.switchTab(initialTab, { initial: true });
            this.initData();
        },

        initData() {
            // The Firebase module runs before DOMContentLoaded; the short wait only covers slow CDN loads.
            // Cached items are already on screen in the meantime.
            setTimeout(() => {
                if (window.firebaseDb && window.firebaseDocs) {
                    this.state.isOnline = true;
                    this.dom.syncStatus.textContent = 'מחובר לענן';
                    this.dom.syncStatus.classList.add('online');
                    Object.keys(LISTS).forEach(key => this.setupFirebaseSync(key));
                }
            }, window.firebaseDb ? 0 : 1000);
        },

        setupFirebaseSync(key) {
            const { collection, onSnapshot } = window.firebaseDocs;
            const itemsRef = collection(window.firebaseDb, LISTS[key].collection);

            onSnapshot(itemsRef, (snapshot) => {
                const items = [];
                snapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });
                this.state.lists[key].items = items;
                store.set(LISTS[key].itemsKey, items);
                if (key === this.state.tab) this.render();
                else this.updateBadges();
            }, (error) => {
                console.error("Firebase sync error:", error);
                this.dom.syncStatus.textContent = 'שגיאת סנכרון';
                this.dom.syncStatus.classList.remove('online');
            });
        },

        uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },

        // Firestore rejects undefined values
        clean(data) { return Object.fromEntries(Object.entries(data).filter(([, v]) => v !== undefined)); },

        async saveItem(item, key = this.state.tab) {
            const list = this.state.lists[key];
            const index = list.items.findIndex(i => i.id === item.id);
            if (index > -1) list.items[index] = item;
            else list.items.push(item);
            store.set(LISTS[key].itemsKey, list.items);
            this.render();

            if (this.state.isOnline) {
                const { doc, setDoc } = window.firebaseDocs;
                try {
                    const { id, ...data } = item;
                    await setDoc(doc(window.firebaseDb, LISTS[key].collection, item.id), this.clean(data));
                } catch (e) { console.error("Error saving to Firebase:", e); this.toast('השמירה לענן נכשלה'); }
            }
        },

        async saveMany(items, key = this.state.tab) {
            if (!items.length) return;
            const list = this.state.lists[key];
            items.forEach(item => {
                const index = list.items.findIndex(i => i.id === item.id);
                if (index > -1) list.items[index] = item;
                else list.items.push(item);
            });
            store.set(LISTS[key].itemsKey, list.items);
            this.render();

            if (this.state.isOnline) {
                const { doc, writeBatch } = window.firebaseDocs;
                const batch = writeBatch(window.firebaseDb);
                items.forEach(item => {
                    const { id, ...data } = item;
                    batch.set(doc(window.firebaseDb, LISTS[key].collection, id), this.clean(data));
                });
                try { await batch.commit(); } catch (e) { console.error("Error batch saving:", e); this.toast('השמירה לענן נכשלה'); }
            }
        },

        async deleteItem(id, key = this.state.tab) {
            return this.deleteMultiple([id], key);
        },

        async deleteMultiple(ids, key = this.state.tab) {
            if (!ids.length) return;
            const list = this.state.lists[key];
            list.items = list.items.filter(i => !ids.includes(i.id));
            store.set(LISTS[key].itemsKey, list.items);
            this.render();

            if (this.state.isOnline) {
                const { doc, writeBatch } = window.firebaseDocs;
                const batch = writeBatch(window.firebaseDb);
                ids.forEach(id => {
                    batch.delete(doc(window.firebaseDb, LISTS[key].collection, id));
                });
                try { await batch.commit(); } catch (e) { console.error("Error batch deleting:", e); }
            }
        },

        cacheDOM() {
            this.dom = {
                input: document.getElementById('main-input'), list: document.getElementById('list-container'),
                mainQty: document.getElementById('main-qty'), suggestions: document.getElementById('suggestions-box'),
                progText: document.getElementById('progress-text'), progBar: document.getElementById('progress-bar'),
                header: document.getElementById('header'), editModal: document.getElementById('edit-modal'),
                editId: document.getElementById('edit-id'), editName: document.getElementById('edit-name'),
                editQty: document.getElementById('edit-qty'), editCat: document.getElementById('edit-category'),
                editPrice: document.getElementById('edit-price'), editLink: document.getElementById('edit-link'),
                editNote: document.getElementById('edit-note'), editPriority: document.getElementById('edit-priority'),
                editSubtotal: document.getElementById('edit-subtotal'), editTitle: document.getElementById('edit-title'),
                editSaveBtn: document.getElementById('edit-save-btn'),
                settingsModal: document.getElementById('settings-modal'), categoryEditList: document.getElementById('category-edit-list'),
                settingsTitle: document.getElementById('settings-title'),
                packsModal: document.getElementById('packs-modal'), packsBody: document.getElementById('packs-body'),
                packsTitle: document.getElementById('packs-title'), packsAddBtn: document.getElementById('packs-add-btn'),
                searchBtn: document.getElementById('search-btn'), searchRow: document.getElementById('search-row'),
                searchInput: document.getElementById('search-input'), searchClear: document.getElementById('search-clear'),
                searchMeta: document.getElementById('search-meta'), filterBar: document.getElementById('filter-bar'),
                syncStatus: document.getElementById('sync-status'), toast: document.getElementById('toast'),
                main: document.getElementById('main'), fab: document.getElementById('shop-mode-btn')
            };
        },

        bindEvents() {
            this.dom.input.addEventListener('keypress', (e) => { if (e.key === 'Enter') this.addFromInput(); });

            this.dom.searchInput.addEventListener('input', () => {
                this.state.search = this.dom.searchInput.value;
                this.dom.searchClear.classList.toggle('visible', this.state.search.length > 0);
                this.render();
            });
            this.dom.searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') this.toggleSearch();
                if (e.key === 'Enter') this.dom.searchInput.blur();
            });

            ['input', 'change'].forEach(ev => this.dom.editPrice.addEventListener(ev, () => this.updateEditSubtotal()));
            this.dom.editName.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.saveEdit(); });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 10) this.dom.header.classList.add('scrolled');
                else this.dom.header.classList.remove('scrolled');
            }, { passive: true });
            [this.dom.editModal, this.dom.settingsModal, this.dom.packsModal].forEach(modal => {
                modal.addEventListener('click', (e) => { if (e.target === modal) this.closeModal(modal); });
            });
            document.addEventListener('keydown', (e) => {
                if (e.key !== 'Escape') return;
                const open = document.querySelector('.modal-overlay.active');
                if (open) this.closeModal(open);
            });

            window.addEventListener('hashchange', () => {
                const tab = location.hash.slice(1);
                if (LISTS[tab] && tab !== this.state.tab) this.switchTab(tab);
            });

            // Horizontal swipe on the list switches tabs (RTL: dragging right reveals the tab on the left)
            let sx = 0, sy = 0, tracking = false;
            this.dom.main.addEventListener('touchstart', (e) => {
                tracking = e.touches.length === 1 && !e.target.closest('.filter-bar, input, textarea, select');
                if (tracking) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
            }, { passive: true });
            this.dom.main.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                const t = e.changedTouches[0];
                const dx = t.clientX - sx, dy = t.clientY - sy;
                if (Math.abs(dx) > 80 && Math.abs(dy) < Math.abs(dx) * 0.5) this.switchTab(dx > 0 ? 'home' : 'grocery');
            }, { passive: true });
        },

        openModal(modal) { modal.classList.add('active'); },
        closeModal(modal) { modal.classList.remove('active'); },

        switchTab(tab, { initial = false } = {}) {
            if (!LISTS[tab] || (tab === this.state.tab && !initial)) return;
            this.state.tab = tab;
            store.set('premium_active_tab', tab);
            if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);

            document.body.classList.toggle('tab-home', tab === 'home');
            Object.keys(LISTS).forEach(key => {
                const btn = document.getElementById('tab-' + key);
                btn.classList.toggle('active', key === tab);
                btn.setAttribute('aria-selected', String(key === tab));
            });

            this.dom.searchInput.placeholder = this.cfg.searchPlaceholder;
            this.dom.editTitle.textContent = this.cfg.editTitle;
            this.dom.editSaveBtn.textContent = this.cfg.saveLabel;
            this.dom.editSaveBtn.nextElementSibling.textContent = this.cfg.deleteLabel;
            this.updateInputPlaceholder();
            this.populateCategories();

            this.state.animate = true;
            this.render();
            if (!initial) window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        updateInputPlaceholder() {
            const filter = this.state.homeFilter;
            if (this.isHome && filter !== 'ALL') {
                this.dom.input.placeholder = `הוסף ל${this.splitLabel(this.list.categories[filter]).text}...`;
            } else {
                this.dom.input.placeholder = this.cfg.placeholder;
            }
        },

        setHomeFilter(key) {
            this.state.homeFilter = this.state.homeFilter === key ? 'ALL' : key;
            if (this.state.homeFilter !== 'ALL') this.state.collapsed[this.state.homeFilter] = false;
            this.updateInputPlaceholder();
            this.state.animate = true;
            this.render();
            const chip = this.dom.filterBar.querySelector(`[data-key="${this.state.homeFilter}"]`);
            if (chip) chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        },

        toggleCollapse(key) {
            this.state.collapsed[key] = !this.state.collapsed[key];
            store.set('premium_home_collapsed_v1', this.state.collapsed);
            const group = this.dom.list.querySelector(`.category-group[data-key="${key}"]`);
            if (group) {
                group.classList.toggle('collapsed', this.state.collapsed[key]);
                group.querySelector('.cat-head').setAttribute('aria-expanded', String(!this.state.collapsed[key]));
            }
        },

        toggleSearch() {
            this.state.searchOpen = !this.state.searchOpen;
            this.dom.searchRow.classList.toggle('active', this.state.searchOpen);
            this.dom.searchBtn.classList.toggle('search-active', this.state.searchOpen);

            if (this.state.searchOpen) {
                this.dom.searchInput.focus();
            } else {
                this.state.search = '';
                this.dom.searchInput.value = '';
                this.dom.searchClear.classList.remove('visible');
                this.dom.searchMeta.textContent = '';
            }
            this.render();
        },

        clearSearch() {
            this.state.search = '';
            this.dom.searchInput.value = '';
            this.dom.searchClear.classList.remove('visible');
            this.dom.searchInput.focus();
            this.render();
        },

        // Normalizes for comparison: lowercase, no leading/trailing spaces, no Hebrew niqqud/geresh noise
        normalize(str) {
            return String(str || '').toLowerCase().trim().replace(/["'׳״]/g, '');
        },

        matchesSearch(item, query) {
            if (!query) return true;
            return this.normalize(item.name).includes(query) || this.normalize(item.category).includes(query)
                || (item.note && this.normalize(item.note).includes(query));
        },

        escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        },

        highlight(name) {
            // Lowercase only (no character stripping) so indices stay aligned with the original string
            const query = this.state.search.trim().toLowerCase();
            if (!query) return this.escapeHtml(name);
            const idx = name.toLowerCase().indexOf(query);
            if (idx === -1) return this.escapeHtml(name);
            return this.escapeHtml(name.slice(0, idx))
                + '<mark class="hl">' + this.escapeHtml(name.slice(idx, idx + query.length)) + '</mark>'
                + this.escapeHtml(name.slice(idx + query.length));
        },

        // '🛋️ סלון' -> { icon: '🛋️', text: 'סלון' }; survives user-renamed categories without an emoji
        splitLabel(label) {
            const m = String(label || '').match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}\p{Emoji_Modifier}]*)\s*(.*)$/u);
            return m ? { icon: m[1], text: m[2] || m[1] } : { icon: '📦', text: String(label || '') };
        },

        formatMoney(n) { return this.money.format(Math.round(n || 0)); },

        parsePrice(str) {
            const num = parseFloat(String(str || '').replace(/[^\d.]/g, ''));
            return isNaN(num) || num <= 0 ? null : Math.round(num * 100) / 100;
        },

        safeLink(link) {
            const url = String(link || '').trim();
            if (!url) return '';
            const withProto = /^https?:\/\//i.test(url) ? url : 'https://' + url;
            try { return ['http:', 'https:'].includes(new URL(withProto).protocol) ? withProto : ''; } catch (e) { return ''; }
        },

        itemTotal(item) { return (Number(item.price) || 0) * (item.quantity || 1); },

        catKeyOf(item, key = this.state.tab) {
            const cats = this.state.lists[key].categories;
            return Object.keys(cats).find(k => cats[k] === item.category) || 'OTHER';
        },

        detectCategory(name, key = this.state.tab) {
            const list = this.state.lists[key];
            const lowerName = name.toLowerCase().trim().replace(/״/g, '"').replace(/׳/g, "'");

            // 1. Check user's learned dictionary first for exact match
            if (list.learnedDict[lowerName]) {
                return list.learnedDict[lowerName];
            }

            // 2. Check if the learned dictionary contains a word that is IN the input
            for (const learnedWord in list.learnedDict) {
                if (lowerName.includes(learnedWord)) {
                    return list.learnedDict[learnedWord];
                }
            }

            // 3. Fallback to built-in Smart Dict
            const dict = this.dicts[key];
            for (const word of this.sortedDictKeys[key]) {
                if (lowerName.includes(word)) {
                    return list.categories[dict[word]];
                }
            }

            return list.categories.OTHER;
        },

        learnCategory(name, categoryName) {
            const lowerName = name.trim().toLowerCase();
            // We map the exact word to the category the user selected
            this.list.learnedDict[lowerName] = categoryName;
            store.set(this.cfg.dictKey, this.list.learnedDict);
        },

        changeMainQty(delta) {
            this.state.mainQty = Math.max(1, this.state.mainQty + delta);
            this.dom.mainQty.value = this.state.mainQty;
        },

        setMainQty(val) {
            let num = parseInt(val);
            if (isNaN(num) || num < 1) num = 1;
            this.state.mainQty = num;
            this.dom.mainQty.value = num;
        },

        // "ספה 3500₪" / "מנורה ₪250" / "שטיח 900 ש"ח" -> name + price (home tab only)
        parseNameAndPrice(text) {
            const m = text.match(/^(.*?)\s*(?:₪\s*(\d[\d,.]*)|(\d[\d,.]*)\s*(?:₪|ש["״]?ח|שקל(?:ים)?))\s*$/);
            if (!m || !m[1].trim()) return { name: text, price: null };
            return { name: m[1].trim(), price: this.parsePrice(m[2] || m[3]) };
        },

        addFromInput() {
            const raw = this.dom.input.value.trim();
            if (!raw) return;
            if (this.isHome) {
                const { name, price } = this.parseNameAndPrice(raw);
                const filter = this.state.homeFilter;
                this.addItem(name, this.state.mainQty, { price, category: filter !== 'ALL' ? this.list.categories[filter] : undefined });
            } else {
                this.addItem(raw, this.state.mainQty);
            }
            this.dom.input.value = '';
            this.state.mainQty = 1;
            this.dom.mainQty.value = '1';
            this.dom.input.blur();
        },

        addItem(name, qty = 1, opts = {}) {
            const existing = this.list.items.find(i => i.name === name && !i.completed);
            if (existing) {
                existing.quantity += qty;
                if (opts.price) existing.price = opts.price;
                this.saveItem(existing);
                if (this.isHome) this.toast(`${name} — הכמות עודכנה ל-${existing.quantity}`);
                return existing;
            }
            const newItem = { id: this.uid(), name: name, quantity: qty, category: opts.category || this.detectCategory(name), completed: false, createdAt: Date.now() };
            if (this.isHome) {
                Object.assign(newItem, { price: opts.price || null, priority: 'normal', note: '', link: '' });
                this.state.collapsed[this.catKeyOf(newItem)] = false;
            }
            this.saveItem(newItem);
            if (this.isHome) this.toast(`נוסף ל${newItem.category}`, 'עריכה', () => this.openEdit(newItem.id));
            return newItem;
        },

        toggleItem(id) {
            const item = this.list.items.find(i => i.id === id);
            if (item) { item.completed = !item.completed; this.saveItem(item); }
        },

        changeItemQty(id, delta, event) {
            event.stopPropagation();
            const item = this.list.items.find(i => i.id === id);
            if (item) { item.quantity = Math.max(1, item.quantity + delta); this.saveItem(item); }
        },

        setItemQty(id, val, event) {
            if (event) event.stopPropagation();
            let num = parseInt(val);
            if (isNaN(num) || num < 1) num = 1;
            const item = this.list.items.find(i => i.id === id);
            if (item) { item.quantity = num; this.saveItem(item); }
        },

        openEdit(id, event, focusField) {
            if (event) event.stopPropagation();
            const item = this.list.items.find(i => i.id === id);
            if (!item) return;

            this.dom.editId.value = item.id;
            this.dom.editName.value = item.name;
            this.state.editQty = item.quantity;
            this.dom.editQty.value = item.quantity;
            if (![...this.dom.editCat.options].some(o => o.value === item.category)) this.populateCategories(item.category);
            this.dom.editCat.value = item.category;
            if (this.isHome) {
                this.dom.editPrice.value = item.price ? String(item.price) : '';
                this.dom.editLink.value = item.link || '';
                this.dom.editNote.value = item.note || '';
                this.setEditPriority(item.priority || 'normal');
                this.updateEditSubtotal();
            }
            this.openModal(this.dom.editModal);
            if (focusField === 'price') setTimeout(() => this.dom.editPrice.focus(), 350);
        },

        closeEdit() { this.closeModal(this.dom.editModal); },

        setEditPriority(p) {
            this.state.editPriority = p;
            this.dom.editPriority.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.p === p));
        },

        updateEditSubtotal() {
            const price = this.parsePrice(this.dom.editPrice.value);
            const qty = this.state.editQty;
            this.dom.editSubtotal.textContent = price && qty > 1 ? `סה״כ ${qty} יח׳: ${this.formatMoney(price * qty)}` : '';
        },

        changeEditQty(delta) {
            this.state.editQty = Math.max(1, this.state.editQty + delta);
            this.dom.editQty.value = this.state.editQty;
            this.updateEditSubtotal();
        },

        setEditQty(val) {
            let num = parseInt(val);
            if (isNaN(num) || num < 1) num = 1;
            this.state.editQty = num;
            this.dom.editQty.value = num;
            this.updateEditSubtotal();
        },

        saveEdit() {
            const id = this.dom.editId.value;
            const name = this.dom.editName.value.trim();
            const newCat = this.dom.editCat.value;
            if (!name) { this.dom.editName.focus(); return; }

            const item = this.list.items.find(i => i.id === id);
            if (item) {
                item.name = name;
                item.quantity = this.state.editQty;

                // If category changed, learn the preference for this specific term
                if (item.category !== newCat) {
                    this.learnCategory(name, newCat);
                }

                item.category = newCat;
                if (this.isHome) {
                    item.price = this.parsePrice(this.dom.editPrice.value);
                    item.priority = this.state.editPriority;
                    item.link = this.safeLink(this.dom.editLink.value);
                    item.note = this.dom.editNote.value.trim();
                }
                this.saveItem(item);
            }
            this.closeEdit();
        },

        deleteFromEdit() {
            const id = this.dom.editId.value;
            const item = this.list.items.find(i => i.id === id);
            const key = this.state.tab;
            this.deleteItem(id);
            this.closeEdit();
            if (item) this.toast(`"${item.name}" נמחק`, 'ביטול', () => this.saveItem(item, key));
        },

        populateCategories(extra) {
            const values = Object.values(this.list.categories);
            if (extra && !values.includes(extra)) values.push(extra);
            this.dom.editCat.innerHTML = values
                .map(c => `<option value="${this.escapeHtml(c)}">${this.escapeHtml(c)}</option>`).join('');
        },

        openSettings() {
            this.dom.settingsTitle.textContent = this.cfg.settingsTitle;
            this.dom.categoryEditList.innerHTML = Object.entries(this.list.categories).map(([key, val]) => `
                <div class="cat-edit-row">
                    <input type="text" class="cat-edit-input" data-key="${key}" value="${this.escapeHtml(val)}">
                </div>
            `).join('');
            this.openModal(this.dom.settingsModal);
        },

        async saveCategories() {
            const inputs = document.querySelectorAll('.cat-edit-input');
            const list = this.list;
            let updated = false;
            const oldToNewMap = {};

            inputs.forEach(input => {
                const key = input.dataset.key;
                const newName = input.value.trim();
                const oldName = list.categories[key];

                if (newName && newName !== oldName) {
                    list.categories[key] = newName;
                    oldToNewMap[oldName] = newName;
                    updated = true;
                }
            });

            if (updated) {
                store.set(this.cfg.catsKey, list.categories);
                this.populateCategories();
                this.updateInputPlaceholder();

                const changed = list.items.filter(item => oldToNewMap[item.category]);
                changed.forEach(item => { item.category = oldToNewMap[item.category]; });

                let dictUpdated = false;
                for (const term in list.learnedDict) {
                    if (oldToNewMap[list.learnedDict[term]]) {
                        list.learnedDict[term] = oldToNewMap[list.learnedDict[term]];
                        dictUpdated = true;
                    }
                }
                if(dictUpdated) store.set(this.cfg.dictKey, list.learnedDict);

                if (changed.length) await this.saveMany(changed);
                else this.render();
            }
            this.closeModal(this.dom.settingsModal);
        },

        clearList() {
            if (confirm('בטוח שברצונך למחוק את כל הרשימה?')) {
                const ids = this.list.items.map(i => i.id);
                this.deleteMultiple(ids);
                this.closeModal(this.dom.settingsModal);
            }
        },

        clearCompleted() {
            const done = this.list.items.filter(i => i.completed);
            const key = this.state.tab;
            this.deleteMultiple(done.map(i => i.id));
            this.closeModal(this.dom.settingsModal);
            if (done.length) this.toast(`נמחקו ${done.length} פריטים שנקנו`, 'ביטול', () => this.saveMany(done, key));
        },

        toggleShoppingMode() {
            this.state.shoppingMode = !this.state.shoppingMode;
            document.body.classList.toggle('shopping-mode', this.state.shoppingMode);
            const text = document.getElementById('shop-mode-text');
            text.textContent = this.state.shoppingMode ? 'יציאה ממצב קנייה' : 'מצב קנייה';
            this.render();
        },

        toast(message, actionLabel, action) {
            const t = this.dom.toast;
            const btn = t.querySelector('.toast-action');
            t.querySelector('.toast-msg').textContent = message;
            btn.hidden = !actionLabel;
            btn.textContent = actionLabel || '';
            btn.onclick = () => { this.hideToast(); if (action) action(); };
            t.classList.add('show');
            clearTimeout(this.toastTimer);
            this.toastTimer = setTimeout(() => this.hideToast(), actionLabel ? 4500 : 2600);
        },

        hideToast() { this.dom.toast.classList.remove('show'); },

        // --- Ready-made room checklists ---
        packStats(catKey) {
            const names = new Set(this.state.lists.home.items.map(i => i.name));
            const pack = HOME_PACKS[catKey] || [];
            return { total: pack.length, existing: pack.filter(n => names.has(n)).length };
        },

        packGridHtml() {
            const cats = this.state.lists.home.categories;
            return `<div class="pack-grid">${Object.keys(HOME_PACKS).map(key => {
                const { icon, text } = this.splitLabel(cats[key]);
                const { total, existing } = this.packStats(key);
                const done = existing === total;
                return `<button class="pack-card ${done ? 'done' : ''}" onclick="App.openPacks('${key}')">
                    <span class="pack-emoji">${icon}</span>
                    <span class="pack-name">${this.escapeHtml(text)}</span>
                    <span class="pack-count">${done ? '✓ הכל ברשימה' : existing ? `${total - existing} מתוך ${total} חסרים` : `${total} פריטים`}</span>
                </button>`;
            }).join('')}</div>`;
        },

        openPacks(catKey) {
            if (catKey && HOME_PACKS[catKey]) {
                const names = new Set(this.state.lists.home.items.map(i => i.name));
                this.packView = { key: catKey, selected: new Set(HOME_PACKS[catKey].filter(n => !names.has(n))) };
            } else {
                this.packView = null;
            }
            this.renderPacks();
            this.openModal(this.dom.packsModal);
        },

        renderPacks() {
            const view = this.packView;
            const btn = this.dom.packsAddBtn;
            if (!view) {
                this.dom.packsTitle.textContent = 'רשימות מוכנות לפי חדר';
                this.dom.packsBody.innerHTML = `<p class="form-hint" style="margin: 0 0 16px; font-size: 14px;">בחרו חדר, סמנו מה צריך — והכל נכנס לרשימה בלחיצה אחת.</p>${this.packGridHtml()}`;
                btn.hidden = true;
                return;
            }
            const label = this.state.lists.home.categories[view.key];
            const names = new Set(this.state.lists.home.items.map(i => i.name));
            const pack = HOME_PACKS[view.key];
            const available = pack.filter(n => !names.has(n));
            const allSelected = available.length > 0 && available.every(n => view.selected.has(n));
            this.dom.packsTitle.textContent = label;
            this.dom.packsBody.innerHTML = `
                <div class="pack-detail-top">
                    <button class="pack-back" onclick="App.openPacks()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        כל החדרים
                    </button>
                    ${available.length ? `<button class="pack-toggle-all" onclick="App.togglePackAll()">${allSelected ? 'נקה הכל' : 'בחר הכל'}</button>` : ''}
                </div>
                <div class="pack-list">${pack.map((name, idx) => {
                    const exists = names.has(name);
                    const checked = exists || view.selected.has(name);
                    return `<div class="pack-item ${exists ? 'exists' : ''}" ${exists ? '' : `onclick="App.togglePackItem(${idx})"`}>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" class="checkbox-input" ${checked ? 'checked' : ''} ${exists ? 'disabled' : ''} tabindex="-1" onclick="event.preventDefault()">
                            <div class="checkbox-custom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                        </div>
                        <span class="pack-item-name">${this.escapeHtml(name)}</span>
                        ${exists ? '<span class="pack-tag">כבר ברשימה</span>' : ''}
                    </div>`;
                }).join('')}</div>`;
            const count = view.selected.size;
            btn.hidden = false;
            btn.disabled = count === 0;
            btn.textContent = count ? `הוסף ${count} פריטים ל${this.splitLabel(label).text}` : (available.length ? 'בחרו פריטים להוספה' : 'כל הפריטים כבר ברשימה');
        },

        togglePackItem(idx) {
            const name = HOME_PACKS[this.packView.key][idx];
            const sel = this.packView.selected;
            sel.has(name) ? sel.delete(name) : sel.add(name);
            this.renderPacks();
        },

        togglePackAll() {
            const names = new Set(this.state.lists.home.items.map(i => i.name));
            const available = HOME_PACKS[this.packView.key].filter(n => !names.has(n));
            const allSelected = available.every(n => this.packView.selected.has(n));
            this.packView.selected = new Set(allSelected ? [] : available);
            this.renderPacks();
        },

        addSelectedPack() {
            const view = this.packView;
            if (!view || !view.selected.size) return;
            const home = this.state.lists.home;
            const category = home.categories[view.key];
            const now = Date.now();
            // Keep the pack's order: it's the order people usually shop a room in
            const items = HOME_PACKS[view.key].filter(n => view.selected.has(n)).map((name, i) => ({
                id: this.uid(), name, quantity: 1, category, completed: false, createdAt: now + i,
                price: null, priority: 'normal', note: '', link: ''
            }));
            this.state.collapsed[view.key] = false;
            this.closeModal(this.dom.packsModal);
            if (this.state.tab !== 'home') this.switchTab('home');
            this.saveMany(items, 'home');
            this.toast(`נוספו ${items.length} פריטים ל${this.splitLabel(category).text}`, 'ביטול', () => this.deleteMultiple(items.map(i => i.id), 'home'));
        },

        updateBadges() {
            Object.keys(LISTS).forEach(key => {
                const n = this.state.lists[key].items.filter(i => !i.completed).length;
                document.getElementById('badge-' + key).textContent = n ? String(n) : '';
            });
        },

        renderSuggestions() {
            this.dom.suggestions.innerHTML = '';
            const activeNames = this.list.items.filter(i => !i.completed).map(i => i.name);
            const filter = this.state.homeFilter;
            let source = this.SUGGESTIONS, category, limit = 6;
            if (this.isHome) {
                const allNames = new Set(this.list.items.map(i => i.name));
                source = (filter !== 'ALL' && HOME_PACKS[filter] ? HOME_PACKS[filter] : this.HOME_SUGGESTIONS).filter(s => !allNames.has(s));
                category = filter !== 'ALL' ? this.list.categories[filter] : undefined;
                limit = 8;
            }
            const available = source.filter(s => !activeNames.includes(s));

            available.slice(0, limit).forEach(s => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'chip';
                chip.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> ${this.escapeHtml(s)}`;
                chip.onclick = () => this.addItem(s, 1, { category });
                this.dom.suggestions.appendChild(chip);
            });
        },

        render() {
            this.updateBadges();
            this.renderSuggestions();
            this.dom.list.innerHTML = '';

            // Entry animation only on tab switch / filter change, not on every check-off
            if (this.state.animate) {
                this.state.animate = false;
                this.dom.list.classList.remove('animate');
                void this.dom.list.offsetWidth;
                this.dom.list.classList.add('animate');
                clearTimeout(this.animTimer);
                this.animTimer = setTimeout(() => this.dom.list.classList.remove('animate'), 700);
            }

            const items = this.list.items;
            const total = items.length;
            const completedCount = items.filter(i => i.completed).length;

            // Progress always reflects the full list, not the filtered view
            this.dom.progText.textContent = `${completedCount}/${total} נקנו`;
            this.dom.progBar.style.width = total === 0 ? '0%' : `${(completedCount / total) * 100}%`;
            this.dom.fab.hidden = total === 0 && !this.state.shoppingMode;

            if (this.isHome) return this.renderHome();

            if (total === 0) {
                this.dom.searchMeta.textContent = '';
                this.dom.list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                        <h3>הרשימה ריקה</h3>
                        <p>השתמש בשדה למטה כדי להוסיף מצרכים בקלות</p>
                    </div>`;
                return;
            }

            const query = this.normalize(this.state.search);
            const visible = items.filter(i => this.matchesSearch(i, query));
            this.renderSearchMeta(query, visible);

            if (query && visible.length === 0) {
                this.dom.list.innerHTML = this.noResultsHtml('נסה מילה חלקית, למשל "חל" במקום "חלב 3%"');
                return;
            }

            const categories = this.list.categories;
            const active = visible.filter(i => !i.completed);
            const completed = visible.filter(i => i.completed);
            const grouped = {};

            Object.values(categories).forEach(c => grouped[c] = []);
            active.forEach(i => {
                if (grouped[i.category]) {
                    grouped[i.category].push(i);
                } else {
                    if (!grouped[categories.OTHER]) grouped[categories.OTHER] = [];
                    grouped[categories.OTHER].push(i);
                }
            });

            Object.values(categories).forEach(cat => {
                if (grouped[cat] && grouped[cat].length > 0) this.dom.list.appendChild(this.buildGroup(cat, grouped[cat]));
            });

            // While searching, the completed group is shown even in shopping mode —
            // finding a checked item and unchecking it is the whole point of the search
            if (completed.length > 0 && (!this.state.shoppingMode || query)) {
                const title = query ? '✅ נקנו — הקש כדי להחזיר לרשימה' : '✅ הושלמו';
                this.dom.list.appendChild(this.buildGroup(title, completed, true));
            }
        },

        renderSearchMeta(query, visible) {
            if (query) {
                const foundDone = visible.filter(i => i.completed).length;
                this.dom.searchMeta.textContent = visible.length === 0
                    ? 'אין התאמות'
                    : `${visible.length} תוצאות, מתוכן ${foundDone} מסומנות כנקנו`;
            } else {
                this.dom.searchMeta.textContent = this.state.searchOpen ? (this.isHome ? 'הקלד שם פריט, חדר או הערה' : 'הקלד שם מוצר או קטגוריה') : '';
            }
        },

        noResultsHtml(hint) {
            return `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <h3>לא נמצא מוצר תואם</h3>
                    <p>${this.escapeHtml(hint)}</p>
                </div>`;
        },

        renderFilterBar() {
            const { items, categories } = this.list;
            const counts = {};
            items.forEach(i => { if (!i.completed) { const k = this.catKeyOf(i); counts[k] = (counts[k] || 0) + 1; } });
            const totalActive = items.filter(i => !i.completed).length;
            const filter = this.state.homeFilter;
            const scroll = this.dom.filterBar.scrollLeft;
            this.dom.filterBar.innerHTML = `<button class="fchip ${filter === 'ALL' ? 'active' : ''}" data-key="ALL" onclick="App.setHomeFilter('ALL')">🏠 הכל${totalActive ? ` <span class="fcount">${totalActive}</span>` : ''}</button>`
                + Object.entries(categories).map(([key, label]) => {
                    const n = counts[key] || 0;
                    return `<button class="fchip ${filter === key ? 'active' : ''} ${n ? '' : 'is-empty'}" data-key="${key}" onclick="App.setHomeFilter('${key}')">${this.escapeHtml(label)}${n ? ` <span class="fcount">${n}</span>` : ''}</button>`;
                }).join('');
            this.dom.filterBar.scrollLeft = scroll;
        },

        renderHome() {
            const { items, categories } = this.list;
            const filter = this.state.homeFilter;
            const query = this.normalize(this.state.search);
            this.renderFilterBar();

            if (items.length === 0) {
                this.dom.searchMeta.textContent = '';
                this.dom.list.innerHTML = `
                    <div class="empty-state home-empty">
                        <div class="es-emoji">🏡</div>
                        <h3>בונים בית? מתחילים כאן</h3>
                        <p>הוסיפו רהיטים ומוצרי חשמל בשדה למטה, או התחילו מרשימה מוכנה לפי חדר</p>
                        ${this.packGridHtml()}
                    </div>`;
                return;
            }

            const inScope = items.filter(i => filter === 'ALL' || this.catKeyOf(i) === filter);
            const visible = inScope.filter(i => this.matchesSearch(i, query));
            this.renderSearchMeta(query, visible);

            if (query && visible.length === 0) {
                this.dom.list.innerHTML = this.noResultsHtml(filter !== 'ALL' ? 'החיפוש מוגבל לחדר שנבחר — נסו "הכל"' : 'נסו מילה חלקית, שם חדר או מילה מההערות');
                return;
            }

            if (inScope.length === 0) {
                const { icon, text } = this.splitLabel(categories[filter]);
                const hasPack = !!HOME_PACKS[filter];
                const box = document.createElement('div');
                box.className = 'empty-cat';
                box.innerHTML = `
                    <div class="ec-emoji">${icon}</div>
                    <h3>עוד אין כלום ב${this.escapeHtml(text)}</h3>
                    <p>כל מה שתוסיפו עכשיו מהשדה למטה ייכנס ישר לכאן</p>
                    ${hasPack ? `<button class="soft-btn" onclick="App.openPacks('${filter}')">✨ רשימה מוכנה ל${this.escapeHtml(text)} (${HOME_PACKS[filter].length} פריטים)</button>` : ''}`;
                this.dom.list.appendChild(box);
                return;
            }

            if (!query && !this.state.shoppingMode) this.dom.list.appendChild(this.buildSummary(inScope));

            const rank = { high: 0, normal: 1, low: 2 };
            const byPriority = arr => arr.slice().sort((a, b) => (rank[a.priority] ?? 1) - (rank[b.priority] ?? 1));
            const active = visible.filter(i => !i.completed);
            const completed = visible.filter(i => i.completed);
            const grouped = {};
            active.forEach(i => { const k = this.catKeyOf(i); (grouped[k] = grouped[k] || []).push(i); });

            Object.entries(categories).forEach(([key, label]) => {
                if (grouped[key]) this.dom.list.appendChild(this.buildHomeGroup(key, label, byPriority(grouped[key])));
            });

            if (completed.length > 0 && (!this.state.shoppingMode || query)) {
                const title = query ? '✅ נקנו — הקש כדי להחזיר לרשימה' : '✅ נקנו';
                this.dom.list.appendChild(this.buildHomeGroup('DONE', title, completed, true));
            }

            if (active.length === 0 && !query && completed.length > 0) {
                const done = document.createElement('div');
                done.className = 'empty-cat';
                done.innerHTML = `<div class="ec-emoji">🎉</div><h3>הכל נקנה!</h3><p>כל הפריטים כאן מסומנים כנקנו</p>`;
                this.dom.list.insertBefore(done, this.dom.list.children[1] || null);
            }
        },

        buildSummary(items) {
            const filter = this.state.homeFilter;
            const priced = items.filter(i => Number(i.price) > 0);
            const sum = arr => arr.reduce((acc, i) => acc + this.itemTotal(i), 0);
            const total = sum(priced);
            const spent = sum(priced.filter(i => i.completed));
            const done = items.filter(i => i.completed).length;
            const unpriced = items.filter(i => !i.completed && !(Number(i.price) > 0)).length;
            const scope = filter !== 'ALL' ? this.splitLabel(this.list.categories[filter]).text : 'כל הבית';

            const el = document.createElement('section');
            el.className = 'home-summary';
            el.innerHTML = `
                <div class="sum-head">
                    <div>
                        <div class="sum-label">תקציב · ${this.escapeHtml(scope)}</div>
                        <div class="sum-amount">${this.formatMoney(total)}</div>
                    </div>
                    ${HOME_PACKS[filter] || filter === 'ALL' ? `<button class="sum-pack-btn" onclick="App.openPacks(${filter !== 'ALL' ? `'${filter}'` : ''})">✨ רשימות מוכנות</button>` : ''}
                </div>
                <div class="sum-stats">
                    <div class="sum-stat"><span>נקנה</span><b>${this.formatMoney(spent)}</b></div>
                    <div class="sum-stat"><span>נותר</span><b>${this.formatMoney(total - spent)}</b></div>
                    <div class="sum-stat"><span>פריטים</span><b>${done}/${items.length}</b></div>
                </div>
                <div class="sum-bar"><div style="width: ${items.length ? (done / items.length) * 100 : 0}%"></div></div>
                ${unpriced ? `<div class="sum-hint">${unpriced === 1 ? 'פריט אחד עדיין בלי מחיר' : `${unpriced} פריטים עדיין בלי מחיר`}</div>` : ''}`;
            return el;
        },

        buildHomeGroup(key, title, items, isCompleted = false) {
            const group = document.createElement('div');
            const collapsed = !!this.state.collapsed[key] && !this.state.search.trim();
            group.className = `category-group ${collapsed ? 'collapsed' : ''}`;
            group.dataset.key = key;

            const subtotal = items.reduce((acc, i) => acc + this.itemTotal(i), 0);
            const head = document.createElement('button');
            head.type = 'button';
            head.className = 'cat-head';
            head.setAttribute('aria-expanded', String(!collapsed));
            head.innerHTML = `
                <span>${this.escapeHtml(title)}</span>
                <span class="cat-count">${items.length}</span>
                ${subtotal ? `<span class="cat-sum">${this.formatMoney(subtotal)}</span>` : ''}
                <svg class="cat-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
            head.onclick = () => this.toggleCollapse(key);
            group.appendChild(head);

            const card = document.createElement('div');
            card.className = 'items-card';
            const showCategory = isCompleted || !!this.state.search.trim();

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = `item-row home-row ${isCompleted ? 'completed' : ''}`;
                row.onclick = () => this.toggleItem(item.id);

                const price = Number(item.price) || 0;
                const qty = item.quantity || 1;
                const link = this.safeLink(item.link);
                const pill = item.priority === 'high' ? '<span class="pill high">🔥 דחוף</span>'
                    : item.priority === 'low' ? '<span class="pill low">יכול לחכות</span>' : '';
                const priceHtml = price
                    ? `<div class="price-col"><span class="price-main">${this.formatMoney(price * qty)}</span>${qty > 1 ? `<span class="price-unit">${this.formatMoney(price)} ליח׳</span>` : ''}</div>`
                    : (isCompleted ? '' : `<button class="add-price" onclick="App.openEdit('${item.id}', event, 'price')">+ מחיר</button>`);

                row.innerHTML = `
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox-input" ${isCompleted ? 'checked' : ''} onclick="event.stopPropagation(); App.toggleItem('${item.id}')" aria-label="סמן כנקנה">
                        <div class="checkbox-custom">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                    </div>
                    <div class="item-content">
                        <span class="item-name">${this.highlight(item.name)}${qty > 1 ? `<span class="qty-badge">×${qty}</span>` : ''}</span>
                        <div class="item-meta">${pill}${showCategory ? `<span class="item-category-label">${this.escapeHtml(item.category)}</span>` : ''}</div>
                        ${item.note ? `<span class="item-note">${this.highlight(item.note)}</span>` : ''}
                    </div>
                    <div class="item-actions">
                        ${priceHtml}
                        ${link ? `<a class="action-btn link" href="${this.escapeHtml(link)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" aria-label="פתח קישור למוצר">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>` : ''}
                        <button class="action-btn edit" onclick="App.openEdit('${item.id}', event)" aria-label="עריכה">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                    </div>
                `;
                card.appendChild(row);
            });

            group.appendChild(card);
            return group;
        },

        buildGroup(title, items, isCompleted = false) {
            const group = document.createElement('div');
            group.className = 'category-group';

            const header = document.createElement('div');
            header.className = 'category-header';
            header.textContent = title;
            group.appendChild(header);

            const card = document.createElement('div');
            card.className = 'items-card';

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = `item-row ${isCompleted ? 'completed' : ''}`;
                row.onclick = () => this.toggleItem(item.id);

                row.innerHTML = `
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox-input" ${isCompleted ? 'checked' : ''} onclick="event.stopPropagation(); App.toggleItem('${item.id}')">
                        <div class="checkbox-custom">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                    </div>
                    <div class="item-content">
                        <span class="item-name">${this.highlight(item.name)}</span>
                        ${isCompleted && !this.state.search.trim() ? '' : `<span class="item-category-label">${this.escapeHtml(item.category)}</span>`}
                    </div>
                    <div class="item-actions">
                        <div class="qty-control" onclick="event.stopPropagation()">
                            <button class="qty-btn" onclick="App.changeItemQty('${item.id}', -1, event)">-</button>
                            <input type="number" class="qty-input" value="${item.quantity}" min="1" onclick="event.stopPropagation()" onchange="App.setItemQty('${item.id}', this.value, event)">
                            <button class="qty-btn" onclick="App.changeItemQty('${item.id}', 1, event)">+</button>
                        </div>
                        <button class="action-btn edit" onclick="App.openEdit('${item.id}', event)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                    </div>
                `;
                card.appendChild(row);
            });

            group.appendChild(card);
            return group;
        }
    };

    document.addEventListener('DOMContentLoaded', () => App.init());
</script>

</body>
</html>
